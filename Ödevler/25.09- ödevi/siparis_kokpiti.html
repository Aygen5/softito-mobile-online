<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipariş & Gelir Kokpit Dashboard</title>

    <style>
        /* ==========================================================================
           1. CSS DEĞİŞKENLERİ (:root)
           Burada renkleri, yazı tiplerini tek bir merkezde tanımlıyoruz. Böylece bir 
           rengi değiştirmek istediğimizde sadece burayı güncellememiz yeterli olur.
           ========================================================================== */
        :root {
            --bg: #f8f7f4;           /* Sayfa arka plan rengi (Krem/Taş rengi) */
            --card: #ffffff;         /* Kart ve panel beyaz zemin rengi */
            --border: #e6e5df;       /* İnce kenarlık (border) gri tonu */
            --text: #181716;         /* Ana metin ve başlık rengi (Koyu füme/siyah) */
            --muted: #6b6963;        /* İkincil, soluk açıklama metinleri */
            --clay: #c85a32;         /* Vurgu rengi: Kiremit/Terracotta turuncusu */
            --clay-hover: #b04e29;   /* Butonun üzerine gelinceki koyu kiremit tonu */
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif; /* Okunaklı modern font */
            --font-mono: 'JetBrains Mono', monospace;                /* Sayısal ve kod fontu */
        }

        /* ==========================================================================
           2. CSS SIFIRLAMA (RESET)
           Tüm etiketlerin tarayıcı varsayılan boşluklarını sıfırlar.
           box-sizing: border-box sayesinde padding ve border kutunun genişliğini artırmaz.
           ========================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ==========================================================================
           3. GENEL SAYFA GÖVDESİ (BODY)
           Tüm sayfaya arka plan rengi, varsayılan yazı tipi ve kenar boşlukları verir.
           ========================================================================== */
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            padding: 36px 16px;
            line-height: 1.5;
        }

        /* Ana kapsayıcı: Sayfanın en fazla 960px genişlemesini sağlar ve ortalar */
        .kokpit {
            max-width: 960px;
            margin: 0 auto;
        }

        /* ==========================================================================
           4. BAŞLIK VE KPI BİLGİ KARTLARI BÖLÜMÜ
           ========================================================================== */
        /* Üst başlık alanı */
        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border); /* Altına ince gri çizgi çeker */
        }

        /* Başlığın üzerindeki küçük turuncu etiket */
        .header__tag {
            font-size: 11px;
            text-transform: uppercase; /* Tüm harfleri büyük yapar */
            letter-spacing: 0.12em;   /* Harflerin arasına hafif boşluk koyar */
            color: var(--clay);
            font-weight: 700;
        }

        /* Ana sayfa başlığı */
        .header__title {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
        }

        /* 3'lü Özet Kart Izgarası (CSS Grid): Ekranı yan yana 3 eşit kolona böler */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px; /* Kartlar arası boşluk */
            margin-bottom: 24px;
        }

        /* Her bir özet metrik kartı */
        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px; /* Köşeleri hafifçe yuvarlar */
            padding: 14px 18px;
        }

        /* KPI kartının küçük başlık yazısı */
        .kpi-card span {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        /* KPI kartındaki büyük rakamlar (Mono font ile şık finansal görünüm) */
        .kpi-card h3 {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 4px;
        }

        /* ==========================================================================
           5. SAYFA YERLEŞİMİ (LAYOUT - FORM VE LİSTE BÖLÜMÜ)
           Solda 320px sabit genişlikte form, sağda kalan alanı kaplayan liste (1fr).
           ========================================================================== */
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        /* Mobil Duyarlılık (Responsive): Ekran 768px altına inince alt alta dizilir */
        @media (max-width: 768px) {
            .layout,
            .kpi-grid {
                grid-template-columns: 1fr; /* Mobilde tek kolona düşer */
            }
        }

        /* Beyaz içerik panelleri (Hem form hem liste bu panellerin içindedir) */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        /* Panel içindeki başlıklar */
        .panel h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* Her bir form alanı satırı */
        .field {
            margin-bottom: 12px;
        }

        /* Form girdi etiketleri */
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        /* Input ve Select kutularının ortak tasarımı */
        .field input,
        .field select {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        /* Kutunun içine tıklandığında (focus) kiremit renkli çerçeve parlaması */
        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: var(--clay);
            background: #fff;
        }

        /* Siparişi Kaydet ana butonu */
        .btn-submit {
            width: 100%;
            background: var(--clay);
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s ease;
        }

        /* Butonun üzerine gelince rengi hafif koyulaşır */
        .btn-submit:hover {
            background: var(--clay-hover);
        }

        /* ==========================================================================
           6. SAĞ TARAF: FİLTRELEME VE SİPARİŞ LİSTESİ ALANI
           ========================================================================== */
        /* Arama kutusu ve kategori filtresini yan yana dizen flex çubuğu */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* Siparişlerin listelendiği dikey akış kutusu */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;  /* Çok sipariş olunca sayfa uzamasın diye sabit tavan yükseklik */
            overflow-y: auto;   /* 380px'i aşarsa kendi içinde kaydırma çubuğu (scroll) çıkar */
        }

        /* Listedeki her bir tekil sipariş kartı */
        .order-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between; /* Sol tarafta ürün bilgisi, sağda buton ve rozet */
            align-items: center;
        }

        /* Ürün adı */
        .order-item h5 {
            font-size: 13px;
            font-weight: 600;
        }

        /* Birim fiyat yazısı */
        .order-item p {
            font-size: 12px;
            color: var(--muted);
        }

        /* Sağ taraftaki rozet ve sil butonunu yan yana tutan flex kutusu */
        .meta-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Kategori rozetlerinin temel biçimlendirmesi */
        .badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            font-family: var(--font-mono);
        }

        /* Kategoriye göre renk varyasyonları (BEM tarzı isimlendirme) */
        .badge--mobilya {
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge--aydinlatma {
            background: #fef3c7;
            color: #b45309;
        }

        .badge--mutfak {
            background: #d1fae5;
            color: #065f46;
        }

        /* Sil Butonu: Varsayılan olarak sade ve göze batmayan gri kenarlık */
        .btn-del {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Sil butonunun üzerine gelince tehlike uyarısı olarak kırmızıya döner */
        .btn-del:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
    </style>
</head>




<body>
    <!-- Tüm kokpiti saran ana çerçeve -->
    <div class="kokpit">

        <!-- Sayfa Başlığı ve Üst Bilgi Bölümü -->
        <header class="header">
            <span class="header__tag">Sipariş Takip</span>
            <h1 class="header__title">Sipariş Yönetim Kokpit</h1>
        </header>

        <!-- KPI (Temel Performans Göstergeleri) Bölümü: JS buradaki id'leri güncelleyecek -->
        <section class="kpi-grid">
            <div class="kpi-card">
                <span>Kayıtlı Sipariş</span>
                <!-- Toplam sipariş adedinin dinamik basılacağı yer -->
                <h3 id="kpiCount">0</h3>
            </div>

            <div class="kpi-card">
                <span>Toplam Sipariş Tutar</span>
                <!-- Tüm siparişlerin toplam fiyatının dinamik basılacağı yer -->
                <h3 id="kpiTotal">0 ₺</h3>
            </div>

            <div class="kpi-card">
                <span>Ortalama Ürün Fiyatı</span>
                <!-- Ürün başına ortalama birim fiyatın dinamik basılacağı yer -->
                <h3 id="kpiAvg">0 ₺</h3>
            </div>
        </section>

        <!-- Ana Düzen: Sol Panel (Form) ve Sağ Panel (Liste + Arama) -->
        <main class="layout">

            <!-- SOL PANEL: Yeni Sipariş Ekleme Formu -->
            <section class="panel">
                <h4>Yeni sipariş kaydı</h4>
                <!-- submit olduğunda sayfa yenilenmesini engelleyip JS ile veriyi ekleyeceğiz -->
                <form id="orderForm">
                    <div class="field">
                        <label for="prodName">Ürün Adı</label>
                        <input type="text" id="prodName" placeholder="Sehpa" required>
                    </div>

                    <div class="field">
                        <label for="prodCat">Kategori</label>
                        <select id="prodCat">
                            <option value="Mobilya">Mobilya</option>
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="prodPrice">Fiyat</label>
                        <input type="number" id="prodPrice" value="3250" min="100" step="50" required>
                    </div>

                    <!-- type="submit" butona tıklandığında veya Enter'a basıldığında form submit olayını tetikler -->
                    <button type="submit" class="btn-submit">Siparişi Kaydet</button>
                </form>
            </section>

            <!-- SAĞ PANEL: Arama, Filtreleme ve Dinamik Sipariş Listesi -->
            <section class="panel">
                <!-- Canlı Arama ve Kategori Filtreleme Çubuğu -->
                <div class="filter-bar">
                    <!-- Ürün adına göre canlı arama yapılan girdi -->
                    <input type="text" id="searchInput" class="field" style="margin-bottom: 0;"
                        placeholder="Ürün Adına Göre Filtrele">
                    
                    <!-- Kategoriye göre listeyi süzen açılır menü -->
                    <select id="categoryFilter"
                        style="width:140px; font-size:12px; padding:6px; background:var(--bg); border:1px solid var(--border); border-radius:6px;">
                        <option value="ALL">Tüm Kategoriler</option>
                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>
                    </select>
                </div>

                <!-- JavaScript'in sipariş satırlarını dinamik olarak HTML üretip içine basacağı kapsayıcı -->
                <div id="orderContainer" class="order-list">
                </div>
            </section>
        </main>
    </div>





    <!-- ==========================================================================
         JAVASCRIPT BÖLÜMÜ (TÜM MANTIK, VERİ YÖNETİMİ VE ETKİLEŞİM BURADA)
         ========================================================================== -->
    <script>

        /* --------------------------------------------------------------------------
           1. VERİ MODELİ (STATE / BAŞLANGIÇ VERİ SETİ)
           Siparişlerimizi bir JavaScript dizisi (Array) içinde nesneler (Object) 
           olarak saklıyoruz. let ile tanımladık çünkü eleman ekleyip sildikçe 
           bu dizinin içeriği güncellenecektir.
           -------------------------------------------------------------------------- */
        let orders = [
            { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
            { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
            { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
            { id: 4, name: "Bulaşık Makinesi", category: "Mutfak", price: 10000 },
            { id: 5, name: "Ocak", category: "Mutfak", price: 15000 },
        ];



        /* --------------------------------------------------------------------------
           2. DOM ELEMANLARINI YAKALAMA (ELEMENT SELECTORS)
           HTML sayfasındaki butonları, inputları ve kutuları JavaScript tarafında 
           kontrol edebilmek için kimliklerine (id) göre hafızaya (değişkenlere) alıyoruz.
           const kullanıyoruz çünkü yakalanan HTML referansının kendisi değişmeyecek.
           -------------------------------------------------------------------------- */
        const orderContainer = document.getElementById("orderContainer"); // Siparişlerin listelendiği ana kutu
        const orderForm = document.getElementById("orderForm");           // Sol taraftaki sipariş ekleme formu
        const searchInput = document.getElementById("searchInput");       // Arama çubuğu input'u
        const categoryFilter = document.getElementById("categoryFilter"); // Kategori filtresi select'i
        
        // Üst kısımdaki 3 adet KPI (Özet) metin kutusu
        const kpiCount = document.getElementById("kpiCount"); // Kayıtlı sipariş sayısı başlığı
        const kpiTotal = document.getElementById("kpiTotal"); // Toplam tutar başlığı
        const kpiAvg = document.getElementById("kpiAvg");     // Ortalama tutar başlığı



        /* --------------------------------------------------------------------------
           3. KPI HESAPLAMA VE GÜNCELLEME FONKSİYONU (updateKPIs)
           Bu fonksiyon kendisine parametre olarak gelen diziye (dataList) bakar.
           Dizideki sipariş sayısını, toplam tutarı ve ortalamayı hesaplayıp ekrana yazar.
           -------------------------------------------------------------------------- */
        const updateKPIs = (dataList) => {
            // 1. Kayıtlı Sipariş Sayısı: Dizinin uzunluğu (.length) toplam adedi verir.
            kpiCount.textContent = dataList.length;

            // Eğer listede hiç ürün kalmadıysa sıfır yaz ve fonksiyondan çık (return)
            if (dataList.length === 0) {
                kpiTotal.textContent = "0 ₺";
                kpiAvg.textContent = "0 ₺";
                return;
            }

            // 2. Toplam Tutar Hesabı: .reduce() fonksiyonu dizideki tüm sayıları biriktirerek toplar.
            // acc: Biriken ara toplam (accumulator), curr: O anki sipariş nesnesi, 0: Başlangıç değeri
            const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
            
            // .toLocaleString("tr-TR") rakamı Türkçe para formatına çevirir (Örn: 47500 yerine 47.500)
            kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;

            // 3. Ortalama Fiyat: Toplam tutarı sipariş sayısına böleriz.
            const avg = total / dataList.length;
            
            // Math.round(): Küsüratlı çıkarsa en yakın tam sayıya yuvarlar.
            kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
        };

        /* --------------------------------------------------------------------------
           4. EKRANA ÇİZDİRME (RENDER) VE FİLTRELEME FONKSİYONU (renderOrders)
           Bu fonksiyon:
           - Arama kutusundaki harflere ve seçilen kategoriye göre diziyi süzer (filter).
           - Eski HTML listesini temizler.
           - Süzülen her sipariş için JavaScript ile birer <article> kartı oluşturur.
           - Kartları sayfaya ekler (appendChild) ve KPI'ları günceller.
           -------------------------------------------------------------------------- */
        const renderOrders = () => {
            // Arama kutusuna yazılan metni küçük harfe çevirir (.toLowerCase) ve sağ/sol boşlukları siler (.trim)
            const term = searchInput.value.toLowerCase().trim();
            
            // Kategori menüsünde seçili değeri alır ("ALL", "Mobilya", "Aydınlatma", "Mutfak")
            const selectedCat = categoryFilter.value;

            // .filter() metodu: Orijinal diziyi bozmadan şartlara uyan elemanlardan YENİ bir dizi üretir.
            const filtered = orders.filter(order => {
                // Ürün adı aranan kelimeyi içeriyor mu? (includes true/false döner)
                const matchesName = order.name.toLowerCase().includes(term);
                
                // Seçilen kategori "ALL" ise hepsi geçer, değilse kategorisi tam eşleşen geçer
                const matchesCategory = selectedCat === "ALL" || order.category === selectedCat;
                
                // İki şart da sağlanıyorsa (&&) bu ürün listeye dahil edilir
                return matchesName && matchesCategory;
            });

            // Önceki çizilen ürünleri temizle, yoksa her aramada liste alt alta katlanarak çoğalır
            orderContainer.innerHTML = "";

            // Eğer filtre sonucunda hiçbir ürün bulunamadıysa kullanıcıya bilgilendirme göster
            if (filtered.length === 0) {
                orderContainer.innerHTML = `<div style="padding:24px; text-align:center; color:var(--muted); font-size:12px">Kriterlere Uygun Ürün Bulunamadı </div>`;
                updateKPIs([]); // KPI'ları da sıfır olarak güncelle
                return;         // Fonksiyonun kalanını çalıştırma, burada bitir
            }

            // Süzülmüş listedeki her bir sipariş için döngü başlatıyoruz (.forEach)
            filtered.forEach(order => {
                // Bellekte yeni bir <article> HTML etiketi oluşturuyoruz
                const item = document.createElement("article");
                item.className = "order-item"; // CSS stillerini alması için sınıfını verdik
                
                // Silme işleminde bu elemanın id'sini kolayca bulabilmek için data-id attribute'u ekliyoruz
                item.setAttribute("data-id", order.id);

                // Ürünün kategorisine göre doğru renkli rozet sınıfını belirliyoruz (Ternary Operator)
                const badgeClass = order.category === "Mobilya" ? "badge--mobilya" : order.category === "Aydınlatma" ? "badge--aydinlatma" : "badge--mutfak";

                // Template Literal (Ters tırnak ``) kullanarak HTML şablonumuzu dinamik dolduruyoruz
                item.innerHTML = `
                <div>
                    <h5>${order.name}</h5>
                    <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                    <span class="badge ${badgeClass}">${order.category}</span>
                    <!-- data-action="delete" attribute'u silme işleminde tıklanan butonu tanımamızı sağlar -->
                    <button class="btn-del" data-action="delete">Sil</button>
                </div>
                `;
                
                // Hazırladığımız bu kartı sayfadaki #orderContainer içine çocuk eleman olarak monte ediyoruz
                orderContainer.appendChild(item);
            });

            // Ekrandaki güncel listeye göre en üstteki 3 KPI kartını yeniden hesaplatıp yazdırıyoruz
            updateKPIs(filtered);
        }

        /* --------------------------------------------------------------------------
           5. SAYFA AÇILDIĞINDA İLK ÇALIŞMA
           Sayfa ilk yüklendiğinde hafızadaki 5 ürünü ekrana çizdirmek için çağırıyoruz.
           -------------------------------------------------------------------------- */
        renderOrders();

        /* --------------------------------------------------------------------------
           6. CANLI ARAMA VE FİLTRELEME OLAY DİNLEYİCİLERİ (EVENT LISTENERS)
           - input olayı: Klavyeden her harf yazıldığında veya silindiğinde anında tetiklenir.
           - change olayı: Kategori açılır menüsünden başka bir seçenek seçildiğinde tetiklenir.
           -------------------------------------------------------------------------- */
        searchInput.addEventListener("input", renderOrders);
        categoryFilter.addEventListener("change", renderOrders);

        /* --------------------------------------------------------------------------
           7. YENİ SİPARİŞ EKLEME ÖZELLİĞİ (FORM SUBMIT EVENT)
           Kullanıcı "Siparişi Kaydet" butonuna bastığında veya formdayken Enter'a 
           bastığında çalışır.
           -------------------------------------------------------------------------- */
        orderForm.addEventListener("submit", (e) => {
            // e.preventDefault(): Çok önemlidir! HTML formlarının varsayılan davranışı 
            // sayfayı yeniden yüklemektir (refresh). Bu fonksiyon sayfa yenilenmesini engeller.
            e.preventDefault();

            // Formdaki girdi kutularını yakalıyoruz
            const nameInput = document.getElementById("prodName");
            const catSelect = document.getElementById("prodCat");
            const priceInput = document.getElementById("prodPrice");

            // Kullanıcının girdiği verileri alıp temizliyoruz
            const name = nameInput.value.trim();      // Ürün adının başındaki/sonundaki gereksiz boşlukları sil
            const category = catSelect.value;          // Seçilen kategori ("Mobilya" vb.)
            const price = Number(priceInput.value);    // Fiyatı metin (string) yerine sayıya (number) çevir

            // Doğrulama (Validation): İsim boşsa veya fiyat geçersiz/sıfırdan küçükse işlem yapma
            if (!name || isNaN(price) || price <= 0) {
                return;
            }

            // Benzersiz ID Üretme Mantığı:
            // Eğer dizide ürün varsa, var olan ID'lerin en büyüğünü bulup (Math.max) 1 ekliyoruz.
            // Dizi boşsa ilk ID'ye 1 veriyoruz. (Spread operatörü ... ile id dizisini açtık)
            const newId = orders.length > 0 ? Math.max(...orders.map(o => o.id)) + 1 : 1;

            // Yeni sipariş nesnemizi oluşturuyoruz
            const newOrder = {
                id: newId,
                name: name,
                category: category,
                price: price
            };

            // .push() metodu: Yeni siparişi dizinin en sonuna ekler
            orders.push(newOrder);

            // Arayüzü güncelle: Listeyi yeniden çizdir (Böylece yeni ürün görünür ve KPI'lar güncellenir)
            renderOrders();

            // Formu temizle ve yeni giriş için imleci ürün adı kutusuna odakla (.focus)
            orderForm.reset();
            nameInput.focus();
        });

        /* --------------------------------------------------------------------------
           8. SİPARİŞ SİLME ÖZELLİĞİ (EVENT DELEGATION / OLAY DEVREDİLMESİ)
           Neden Event Delegation?
           Çünkü silinecek satırlar JavaScript ile sonradan dinamik üretiliyor. 
           Tek tek butonlara dinleyici eklemek yerine, onların ortak kapsayıcısı olan 
           #orderContainer'ı dinliyoruz.
           -------------------------------------------------------------------------- */
        orderContainer.addEventListener("click", (e) => {
            // e.target: Ekranda farenin tam olarak tıkladığı HTML elemanını verir.
            // Tıklanan şeyin "Sil" butonu olup olmadığını kontrol ediyoruz:
            if (e.target.dataset.action === "delete" || e.target.classList.contains("btn-del")) {
                
                // .closest(): Tıklanan butonun yukarı doğru en yakın ebeveyn ".order-item" kartını bulur
                const orderItem = e.target.closest(".order-item");
                
                if (orderItem) {
                    // HTML kartındaki data-id değerini okuyup sayıya dönüştürüyoruz
                    const orderId = Number(orderItem.getAttribute("data-id"));
                    
                    // .filter() kullanarak silinecek id HARİÇ tüm elemanları yeni dizi olarak koruyoruz.
                    // Böylece tıkladığımız ürün diziden tamamen atılmış (silinmiş) olur.
                    orders = orders.filter(order => order.id !== orderId);
                    
                    // Dizimiz güncellendiğine göre listeyi ve KPI kartlarını anında yeniden çizdiriyoruz
                    renderOrders();
                }
            }
        });

    </script>
</body>

</html>
