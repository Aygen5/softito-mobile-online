    // Dizi Elemanlarımız Ham Veri Seti

    const sarjİstasyonları = [
        { id: "IST-01", lokasyon: "Zorlu Center", tip: "DC", gucKW: 180, durum: "Aktif", seansAdet: 45, tarifeTL: 12 },
        { id: "IST-01", lokasyon: "Akasya AVM", tip: "AC", gucKW: 22, durum: "Aktif", seansAdet: 11, tarifeTL: 9 },

    //1. Map ile döngü 
    // (veriyi dönüştürür ve her elemanı işler. Aynı boyutta YENİ dizi döner)

    const istasyonOzetleri = sarjİstasyonlari.map(ist => {
        return `${ist.lokasyon} (${ist.tip} - ${ist.gucKw}) -> ${ist.durum.toUpperCase()}`;
    });
    console.log("Map Sonucu", istasyonOzetleri);


    const sadeceLokasyonlar = sarjIstasyonlari.map(ist => ist.lokasyon);
    console.log("Lokasyonlar", sadeceLokasyonlar);



    // 2. filter() Şartı Sağlayanları Ayıklar (filtreler ve YENİ dizi döner)
    // Sadece dc ve aktif istasyonları göster

    const aktifDcIstasyonlar = sarjIstasyonlari.filter(ist => ist.tip === "DC" && ist.durum === "Aktif");
    console.table(aktifDcIstasyonlar);



    //3. find ve findIndex (tekil eleman arama)
    const bulunan = sarjIstasyonlari.find(ist => ist.id === "IST-03");
    console.log("Bulunan istasyon", bulunan.lokasyon, bulunan.gucKw, "KW");



    //4. some ve every - Mantıksal kontroller (boolean döner)

    const bakimdaOlanVarmi = sarjIstasyonlari.some(ist => ist.durum === "bakim");
    const hepsiAktifmi = sarjIstasyonlari.every(ist => ist.durum === "Aktif");
    console.log("Bakımda olan var mı", bakimdaOlanVarmi);
    console.log("Tüm istasyonlar aktif mi", hepsiAktifmi);



    //5. reduce() Toplama
    const toplamSeans = sarjIstasyonlari.reduce((aku, istasyon) => {
        return aku + istasyon.seansAdet;
    }, 0);  //Başlangıç değeri 0
    console.log("Toplam Yapılan Şarj Seansı", toplamSeans);





    //6. Zincirleme : Filter->map->reduce
    // Aktif dc istasyonlarının toplam anlık maksimum güç kapasitesi nedir?

    const aktifDcToplamGuc = sarjIstasyonlari.filter(ist => ist.durum === "Aktif" && ist.tip === "DC").map(ist => ist.gucKw).reduce
        ((toplam, guc) => toplam + guc, 0);

    console.log("Aktif dc toplam güç kapasitesi", aktifDcToplamGuc,
        "Kw")

            lokasyon);

            const bostaAdet = this.kapasiteSoket - this.aktifSoketler.length;
            return `${this.ad} istasyonunda ${bostaAdet} adet soket boştadır.`;
        },
        geceTarifesiHesapla: function () {
            const indirim = this.tarife.birimTL * (this.tarife.geceIndirimYuzdesi / 100);
            return this.tarife.birimTL - indirim
        }
